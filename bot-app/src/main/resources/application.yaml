# Server Configuration
server:
  port: ${PORT:8090}

spring:
  application:
    name: spring-bot-manager

  # Redis Configuration (optional - falls back to in-memory if not available)
  # IMPORTANT: avoid empty-string URLs (Spring will fail fast with "Invalid Redis URL ''")
  data:
    redis:
      url: ${REDIS_URL:${REDISCLOUD_URL:redis://localhost:6379}}
      timeout: 5000ms

  # PostgreSQL Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbot}
    username: ${DATABASE_USERNAME:smartbot}
    password: ${DATABASE_PASSWORD:smartbot}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  # ── Security: Auth0 Resource Server ────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-iuo6si32jobgnmod.eu.auth0.com/}
          audience: ${AUTH0_AUDIENCE:https://smartlaundry.api}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# WhatsApp Configuration
